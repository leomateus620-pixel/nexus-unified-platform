name: Escada LC-02
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  circulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:escada
      - run: bun run test:escada:assets
      - run: bunx eslint src/escada src/routes/escada-lc02.tsx src/lib/nexus-nav.ts
      - run: bunx playwright install --with-deps chromium
      - name: Browser circulation, controls and WebGL recovery
        env:
          LC02_URL: http://127.0.0.1:5183
          LC02_BROWSER: chromium
          LC02_SOFTWARE: '1'
          LC02_OUTPUT: test-results/escada-lc02
        run: |
          bun run dev --host 127.0.0.1 --port 5183 > /tmp/lc02-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:5183/escada-lc02 > /dev/null && break
            sleep 1
          done
          bun run test:escada:ui
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: escada-lc02-browser
          path: test-results/escada-lc02
          if-no-files-found: ignore
