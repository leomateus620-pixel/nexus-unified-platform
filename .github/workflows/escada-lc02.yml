name: Escada LC-02
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  circulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:escada
      - run: npm run test:escada:assets
      - run: npx eslint src/escada src/routes/escada-lc02.tsx src/lib/nexus-nav.ts
      - run: npx playwright install --with-deps chromium
      - name: Browser circulation, controls and WebGL recovery
        env:
          LC02_URL: http://127.0.0.1:5183
          LC02_BROWSER: chromium
          LC02_SOFTWARE: '1'
        run: |
          npm run dev -- --host 127.0.0.1 --port 5183 > /tmp/lc02-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:5183/escada-lc02 > /dev/null && break
            sleep 1
          done
          npm run test:escada:ui
