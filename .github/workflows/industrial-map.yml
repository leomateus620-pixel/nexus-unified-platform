name: Industrial map
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test:orcamento
      - run: bun run test:operacional
      - run: bun run test:pessoas
      - run: bun run test:agenda
      - run: bun run test:pet
      - run: bun run test:levantamentos
      - run: bun run test:estudos
      - run: bun run test:almoxarifado
      - run: bun run test:pe:arquivos
      - run: bun run test:pe:leitor
      - name: Install PostgreSQL 17 from PGDG
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error --location \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' "$VERSION_CODENAME" \
            | sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Database tests with PostgreSQL 17
        run: |
          postgres --version
          bun run test:db
      - run: bun run test:industrial
      - run: bun run test:trevisan
      - run: node scripts/audit-industrial-geometry.mjs
      - run: bun run test:industrial:cad
      - run: bunx eslint src/industrial src/routes/mapas-3d.tsx tests/industrial playwright.industrial.config.ts
      - run: bunx eslint src/trevisan src/routes/mapas-3d_.trevisan.tsx src/routes/mapas-3d_.unidades.tsx src/routes/__root.tsx tests/trevisan.test.mjs
      - run: bunx eslint src/features tests/calculo.test.ts tests/planilha.test.ts tests/autorizacao.test.ts
      - run: bun run build
      - run: bun run test:pe:bundle
