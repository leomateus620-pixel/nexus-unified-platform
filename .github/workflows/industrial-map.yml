name: Industrial map
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:industrial
      - run: node scripts/audit-industrial-geometry.mjs
      - run: npx eslint src/industrial src/routes/mapas-3d.tsx tests/industrial playwright.industrial.config.ts
      - run: npm run build
