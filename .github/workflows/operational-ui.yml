name: Operational UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presentation:
    name: presentation (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [legacy, nr, operational]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:ui -- --suite ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-ui-evidence-${{ matrix.suite }}
          path: docs/ui/evidence/
