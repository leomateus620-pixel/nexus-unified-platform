name: Operational UI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-ui-evidence
          path: docs/ui/evidence/
